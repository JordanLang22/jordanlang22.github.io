summary: >-
  A private video library for jiu-jitsu academies. Owners publish programs, and members get access
  by belt rank. I designed and built all of it: [[authentication, tenant isolation, private video,
  billing, and release automation]]. Isolation policy: {{22|Security detail}}. Pricing:
  {{9|Commercial terms}}.
findings:
  - title: Isolation lives in the database
    body: >-
      Tenant boundaries are enforced by [[Postgres row-level security]], retrofitted onto a real
      schema in stages. The binding lives and dies with its transaction, so it can't leak through a
      pooled connection.
  - title: Jobs outlive their runtime
    body: >-
      Intent and job are written in one transaction, and the workflow starts after commit with only
      an ID. The database stays authoritative and the runtime never holds a payload.
  - title: Stale events lose
    body: >-
      Every video webhook must correlate to exactly one record, so an older event can't overwrite a
      newer replacement. Stripe receipts are persisted before dispatch.
  - title: A release undoes itself
    body: >-
      Publishing prepares a candidate, checks the schema, promotes it, verifies it live, and rolls
      back on failure. Only additive migrations apply automatically.
